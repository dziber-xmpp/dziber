[package]
name = "dziber"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["tokio", "image"] }
tokio-xmpp = { version = "5.0.0", default-features = false, features = ["starttls", "ring", "rustls-native-certs"] }
xmpp-parsers = "0.22.0"
tokio = { version = "1.44", features = ["sync", "net", "rt", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.16", features = ["v4", "serde"] }
futures = "0.3.32"
diesel = { version = "2.2", features = ["sqlite", "chrono"] }
diesel_migrations = { version = "2.2", features = ["sqlite"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
vodozemac = "0.10"
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
anyhow = "1"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
hmac = "0.12"
rand = "0.8"
xeddsa = "1"
async-trait = "0.1"
qrcodegen = "1.8"
gtk = "0.14"
gtk-sys = "0.14.0"
gobject-sys = "0.14.0"
glib-sys = "0.14.0"
libnotify = "1.0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rfd = "0.15"
maolan-engine = "0.1"
calcard = "0.3.4"
roxmltree = "0.20"
percent-encoding = "2.3"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls", "smtp-transport", "builder", "ring", "webpki-roots"] }
mail-parser = "0.10"
mail-builder = "0.4"
tokio-rustls = "0.26"
webpki-roots = "0.26"
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
opt-level = 3
lto = true
