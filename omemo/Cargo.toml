[package]
name = "dziber-omemo"
version = "0.0.3"
edition = "2024"
description = "OMEMO end-to-end encryption for XMPP (legacy v0 / libsignal-compatible Double Ratchet)"
license = "BSD-2-Clause"
repository = "https://github.com/dziber-xmpp/dziber"
homepage = "https://github.com/dziber-xmpp/dziber"
keywords = ["xmpp", "omemo", "signal", "encryption", "double-ratchet"]
categories = ["cryptography"]

[dependencies]
vodozemac = "0.10"
xeddsa = "~1.0"
x25519-dalek = "2.0"
zeroize = "1.8"
subtle = "2.6"
thiserror = "2.0"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
minidom = "0.18"
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
